services:
  - type: web
    name: betbot
    runtime: python
    plan: free
    rootDir: ChatBot
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run "ChatBOT Teste.py" --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
